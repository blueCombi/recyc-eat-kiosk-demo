<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Item Rejected</title>
  <link rel="stylesheet" href="itemrejected.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-backdrop" aria-hidden="true"></div>
  <div class="container">
    <header class="header">
      <img src="logo.png" class="logo" alt="Logo">
    </header>

    <h1 class="title">ITEM REJECTED!</h1>
    <div class="subtitle">Your item is returned</div>

    <main class="main-area" role="main">
      <div class="spinner-wrap" aria-hidden="false">
        <div class="spinner" role="img" aria-label="rejected loading spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="inner-disc" aria-hidden="true">
          <div class="center-art">
            <img src="bottlesncan.png" alt="bottle and can">
          </div>
        </div>
      </div>

      <div class="waiting">Please remove the cap and try again.</div>
    </main>
  </div>

  <div class="controls">
    <a href="insert.html" class="btn-cancel" role="button">TRY AGAIN <span class="x">↻</span></a>
  </div>
</body>
</html>
