<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Item Accepted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="itemaccepted.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-backdrop" aria-hidden="true"></div>

  <div class="page">
    <header class="brand">
      <img src="logo.png" class="logo" alt="EcoNova">
    </header>

    <main class="content">
      <div class="status">
        <div class="check-circle" aria-hidden="true">✓</div>
        <h1 class="title">ITEM ACCEPTED!</h1>
        <p class="gain">+<span id="gainValue">5</span> points!</p>
      </div>

      <button type="button" class="points-ring" id="pointsRing" aria-label="Add points">
        <div class="dot-orbit" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="points-center">
          <div class="points-label">Total Points</div>
          <div class="points-value">
            <span id="totalPoints">0</span><span class="star">★</span>
          </div>
        </div>
      </button>

      <button type="button" class="item-row" id="itemToggle" aria-label="Change accepted item, double tap to reject item">
        <span class="item-box">
          <img src="bottle.png" alt="Plastic bottle" class="item-icon" id="itemIcon">
        </span>
        <span class="item-badge" id="itemBadge">Small Plastic Bottle</span>
      </button>
    </main>
  </div>

  <a href="#" class="btn-finish" id="btnFinish" role="button">Finish <span class="check">✓</span></a>

  <footer class="info-bar">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or aluminum can to begin.</span>
  </footer>

  <script type="module">
    import { POINTS, createVoucher, addPoints, scanVoucher } from './firebase-config.js';

    // ── item cycle: small bottle → big bottle → aluminum can (double tap rejects)
    const ITEM_TYPES = [
      { key: "small_bottle", label: "Small Plastic Bottle", pts: POINTS.small_bottle, img: "bottle.png",  alt: "Small plastic bottle" },
      { key: "big_bottle",   label: "Big Plastic Bottle",   pts: POINTS.big_bottle,   img: "bottle.png",  alt: "Big plastic bottle"   },
      { key: "aluminum_can", label: "Aluminum Can",          pts: POINTS.aluminum_can, img: "can.png",     alt: "Aluminum can"         },
    ];

    let itemIndex    = 0;
    let totalPoints  = 0;
    let sessionItems = [];   // track items inserted this session
    let voucherID    = sessionStorage.getItem("voucherID") || null;
    let redirecting  = false;

    const totalEl   = document.getElementById("totalPoints");
    const gainEl    = document.getElementById("gainValue");
    const ring      = document.getElementById("pointsRing");
    const finishBtn = document.getElementById("btnFinish");
    const itemToggle= document.getElementById("itemToggle");
    const itemIcon  = document.getElementById("itemIcon");
    const itemBadge = document.getElementById("itemBadge");

    // ── render ────────────────────────────────────────────────────
    function render(total, gain) {
      totalEl.textContent = total;
      gainEl.textContent  = gain;
      totalEl.parentElement.classList.remove("pop");
      void totalEl.parentElement.offsetWidth;
      totalEl.parentElement.classList.add("pop");
    }

    function updateItemUI() {
      const item      = ITEM_TYPES[itemIndex];
      itemIcon.src    = item.img;
      itemIcon.alt    = item.alt;
      itemBadge.textContent = item.label;
      gainEl.textContent    = item.pts;
    }

    // ── go to redeem if enough points ────────────────────────────
    function checkRedeem(total) {
      if (total >= POINTS.threshold && !redirecting) {
        redirecting = true;
        sessionStorage.setItem("totalPoints", total);
        setTimeout(() => { window.location.href = "redeemready.html"; }, 900);
      }
    }

    // ── load initial state ────────────────────────────────────────
    async function init() {
      // if returning user scanned a QR, load from Firebase
      const returnID = sessionStorage.getItem("returnVoucherID");
      if (returnID) {
        const result = await scanVoucher(returnID);
        if (result.success) {
          totalPoints = result.total_points;
          voucherID   = returnID;
          sessionStorage.removeItem("returnVoucherID");
          sessionStorage.setItem("voucherID", voucherID);
        }
      } else {
        totalPoints = parseInt(sessionStorage.getItem("totalPoints") || "0");
      }

      render(totalPoints, ITEM_TYPES[0].pts);
      checkRedeem(totalPoints);
    }

    // ── add points + save to Firebase ────────────────────────────
    async function handleAddPoints() {
      if (redirecting) return;
      const item = ITEM_TYPES[itemIndex];
      totalPoints += item.pts;

      // track item in session list
      const existing = sessionItems.find(i => i.type === item.key);
      if (existing) { existing.quantity++; existing.points += item.pts; }
      else          { sessionItems.push({ type: item.key, label: item.label, quantity: 1, points: item.pts }); }

      render(totalPoints, item.pts);
      sessionStorage.setItem("totalPoints", totalPoints);

      // save to Firebase
      if (!voucherID) {
        // first item ever — create new voucher
        voucherID = await createVoucher(sessionItems, totalPoints);
        sessionStorage.setItem("voucherID", voucherID);
      } else {
        // update existing voucher
        await addPoints(voucherID, sessionItems, item.pts);
      }

      checkRedeem(totalPoints);
    }

    // ── events ────────────────────────────────────────────────────
    ring.addEventListener("click", handleAddPoints);

    // Single tap on the item switches type and awards it; double tap sends the
    // item back. The timer lets us tell the two apart, since a double click
    // also fires two click events.
    let singleTapTimer = null;

    itemToggle.addEventListener("click", function () {
      if (redirecting || singleTapTimer) return;

      singleTapTimer = setTimeout(function () {
        singleTapTimer = null;
        itemIndex = (itemIndex + 1) % ITEM_TYPES.length;
        updateItemUI();
        handleAddPoints();
      }, 260);
    });

    itemToggle.addEventListener("dblclick", function () {
      if (redirecting) return;
      clearTimeout(singleTapTimer);
      singleTapTimer = null;
      redirecting = true;
      sessionStorage.setItem("totalPoints", totalPoints);
      window.location.href = "itemrejected.html";
    });

    finishBtn.addEventListener("click", function (e) {
      e.preventDefault();
      if (totalPoints >= POINTS.threshold) {
        sessionStorage.setItem("totalPoints", totalPoints);
        window.location.href = "redeemready.html";
      } else {
        sessionStorage.setItem("totalPoints", totalPoints);
        window.location.href = "notenoughpoints.html";
      }
    });

    init();
  </script>
</body>
</html>
