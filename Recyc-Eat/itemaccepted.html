<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Item Accepted</title>
    <link rel="stylesheet" href="itemaccepted.css" />
  </head>
  <body>
    <div class="leaf-layer" aria-hidden="true">
      <span class="leaf leaf-1"></span>
      <span class="leaf leaf-2"></span>
      <span class="leaf leaf-3"></span>
      <span class="leaf leaf-4"></span>
      <span class="leaf leaf-5"></span>
      <span class="leaf leaf-6"></span>
    </div>

    <div class="page-shell">
      <header class="header" aria-label="EcoNova brand">
        <img src="logo.png" class="logo" alt="EcoNova logo" />
      </header>

      <main class="acceptance-panel">
        <div class="success-check" aria-label="Accepted">✓</div>

        <h1>ITEM ACCEPTED!</h1>
        <div class="score-gain">+5 points!</div>

        <div class="score-ring" aria-label="Current total points: 20">
          <div class="ring-orbit" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>

          <div class="score-center">
            <div class="score-label">Total Points</div>
            <div class="score-number">20<span class="star">★</span></div>
          </div>
        </div>

        <div class="item-tag" aria-label="Plastic Bottle item type">
          <img src="bottle.png" class="item-icon" alt="Plastic bottle icon" />
          <span>Plastic Bottle</span>
        </div>
      </main>

      <button class="finish-bar" type="button" aria-label="Finish" onclick="window.location.href='notenoughpointspage.html'">
        <span>Finish</span>
        <span class="finish-check">✓</span>
      </button>

      <div class="helper-text">Insert a plastic bottle or thin can.</div>
    </div>
  </body>
</html>
