<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Receipt Accepted</title>
  <link rel="stylesheet" href="qrreceived.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-container">
    <header class="brand-header">
      <img src="logo.png" class="brand-logo" alt="EcoNova Logo">
    </header>

    <main class="content-area">
      <!-- SUCCESS CHECK -->
      <div class="success-badge">
        <div class="check-circle">✓</div>
      </div>

      <!-- TITLE -->
      <h1 class="title">QR Receipt Accepted!</h1>

      <!-- WELCOME MESSAGE -->
      <div class="welcome-section">
        <p class="welcome-text">Welcome back!</p>
        <p class="subtitle">Your saved points have been restored.</p>
      </div>

      <!-- POINTS RING -->
      <div class="points-ring-container">
        <div class="ring-wrapper">
          <div class="dot-ring" aria-label="Points ring display">
            <span class="dot" style="--index: 0;"></span>
            <span class="dot" style="--index: 1;"></span>
            <span class="dot" style="--index: 2;"></span>
            <span class="dot" style="--index: 3;"></span>
            <span class="dot" style="--index: 4;"></span>
            <span class="dot" style="--index: 5;"></span>
            <span class="dot" style="--index: 6;"></span>
            <span class="dot" style="--index: 7;"></span>
            <span class="dot" style="--index: 8;"></span>
            <span class="dot" style="--index: 9;"></span>
            <span class="dot" style="--index: 10;"></span>
            <span class="dot" style="--index: 11;"></span>
          </div>

          <div class="points-center">
            <div class="points-label">Total Points</div>
            <div class="points-value">
              20<span class="star">★</span>
            </div>
          </div>
        </div>
      </div>

      <!-- REWARDS BANNER -->
      <div class="rewards-banner">
        <p class="banner-title">Keep recycling to earn more points!</p>
        <div class="rewards-list">
          <span class="reward-item">
            <span class="reward-icon">🥤</span>
            <span class="reward-text">Plastic bottles + Thin cans</span>
          </span>
          <span class="reward-divider">—</span>
          <span class="reward-item">
            <span class="reward-icon">⭐</span>
            <span class="reward-text">Points</span>
          </span>
          <span class="reward-divider">—</span>
          <span class="reward-item">
            <span class="reward-icon">🍱</span>
            <span class="reward-text">Food Rewards</span>
          </span>
        </div>
      </div>

      <!-- BUTTONS -->
      <div class="button-group">
        <button class="btn btn-cancel" onclick="window.location.href='recycling.html'">
          <span class="btn-icon">✕</span>
          <span>CANCEL</span>
        </button>
        <button class="btn btn-primary" onclick="window.location.href='insert.html'">
          <span class="btn-icon">♻</span>
          <span>Continue Recycling</span>
        </button>
      </div>
    </main>

    <div class="wave-background" aria-hidden="true"></div>
  </div>
</body>
</html>
