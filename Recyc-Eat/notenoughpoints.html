<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Enough Points</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="notenoughpointspage.css" />
  </head>
  <body>
    <div class="leaf-layer" aria-hidden="true">
      <span class="leaf leaf-1"></span>
      <span class="leaf leaf-2"></span>
      <span class="leaf leaf-3"></span>
      <span class="leaf leaf-4"></span>
      <span class="leaf leaf-5"></span>
      <span class="leaf leaf-6"></span>
    </div>
    <div class="page-backdrop" aria-hidden="true"></div>

    <div class="page-shell">
      <header class="header" aria-label="EcoNova brand">
        <img src="logo.png" class="logo" alt="EcoNova logo" />
      </header>

      <main class="content" role="main">
        <section class="score-ring" id="scoreRing" aria-label="Current total points">
          <div class="ring-orbit" aria-hidden="true">
            <div class="dot dot-1"></div><div class="dot dot-2"></div>
            <div class="dot dot-3"></div><div class="dot dot-4"></div>
            <div class="dot dot-5"></div><div class="dot dot-6"></div>
            <div class="dot dot-7"></div><div class="dot dot-8"></div>
            <div class="dot dot-9"></div><div class="dot dot-10"></div>
            <div class="dot dot-11"></div><div class="dot dot-12"></div>
          </div>
          <div class="score-center">
            <div class="score-label">Total Points</div>
            <div class="score-number">
              <span id="totalPoints">0</span><span class="star">★</span>
            </div>
          </div>
        </section>

        <section class="reward-card" aria-label="Reward requirement">
          <img src="image 32.png" class="reward-icon" alt="Canned food" />
          <div class="reward-copy">
            <div class="reward-points">
              <span class="points-need" id="rewardNeed">50</span> Points
            </div>
            <div class="reward-desc">= 1 Canned Food (Sardines or Tuna)</div>
          </div>
        </section>

        <p class="notice">
          You need <span id="pointsNeeded">50</span> more points to<br />redeem your food reward.
        </p>
      </main>

      <div class="actions">
        <a href="insert.html" class="btn btn-green" role="button" aria-label="Continue Recycling">
          <span class="icon-recycle">♻</span>
          <span>Continue Recycling</span>
        </a>

        <button class="btn btn-outline" type="button" aria-label="Print QR Receipt"
          onclick="window.location.href='printreceipt.html'">
          <img src="image 33.png" alt="Print icon" class="print-icon" />
          <span>Print&nbsp;&nbsp;QR Receipt</span>
        </button>
      </div>
    </div>

    <script>
      (function () {
        var REWARD_POINTS = 50;
        // read from sessionStorage (set by itemaccepted.html)
        var total  = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
        if (isNaN(total) || total < 0) total = 0;
        var needed = Math.max(0, REWARD_POINTS - total);

        document.getElementById("totalPoints").textContent  = total;
        document.getElementById("rewardNeed").textContent   = REWARD_POINTS;
        document.getElementById("pointsNeeded").textContent = needed;
        document.getElementById("scoreRing").setAttribute("aria-label", "Current total points " + total);
      })();
    </script>
  </body>
</html>
