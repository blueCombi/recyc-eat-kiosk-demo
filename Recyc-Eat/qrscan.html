<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan QR Receipt</title>
  <link rel="stylesheet" href="qrscan.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-backdrop" aria-hidden="true"></div>

  <div class="page-shell">
    <header class="header">
      <img src="logo.png" class="logo" alt="EcoNova logo" />
    </header>

    <main class="content" role="main">
      <h1 class="title">SCAN YOUR QR RECEIPT</h1>
      <p class="subtitle">Hold your printed QR receipt in front of the scanner.</p>

      <div class="scan-area" aria-label="QR scanner area">
        <div class="scan-frame">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line"></div>
        </div>
      </div>

      <p class="status-text" id="statusText">Waiting for QR code...</p>
      <p class="error-text" id="errorText" style="display:none;color:#E24B4A;"></p>

      <!-- For demo/testing: manual entry -->
      <div class="manual-entry" style="margin-top:24px;">
        <p style="font-size:13px;color:#4E5F57;">Or enter Receipt ID manually:</p>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;">
          <input type="text" id="manualID" placeholder="e.g. EM-20260821-1413-001"
            style="padding:8px 12px;border-radius:8px;border:1px solid #14848B;font-size:13px;width:220px;" />
          <button id="manualBtn"
            style="padding:8px 16px;background:#14848B;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;">
            Load
          </button>
        </div>
      </div>
    </main>

    <div class="actions" style="margin-top:24px;">
      <a href="recycling.html" class="btn btn-outline" role="button">← Back</a>
    </div>
  </div>

  <script type="module">
    import { scanVoucher } from './firebase-config.js';

    async function loadVoucher(voucherID) {
      const statusText = document.getElementById("statusText");
      const errorText  = document.getElementById("errorText");

      statusText.textContent = "Loading your points...";
      errorText.style.display = "none";

      const result = await scanVoucher(voucherID.trim().toUpperCase());

      if (result.success) {
        // store for use in itemaccepted.html
        sessionStorage.setItem("returnVoucherID", voucherID.trim().toUpperCase());
        sessionStorage.setItem("totalPoints", result.total_points);
        statusText.textContent = "Points loaded! Redirecting...";
        setTimeout(() => { window.location.href = "insert.html"; }, 1200);
      } else {
        errorText.textContent   = result.message;
        errorText.style.display = "block";
        statusText.textContent  = "Scan failed. Please try again.";
      }
    }

    // manual entry button
    document.getElementById("manualBtn").addEventListener("click", function () {
      const id = document.getElementById("manualID").value;
      if (id.trim()) loadVoucher(id);
    });

    document.getElementById("manualID").addEventListener("keydown", function (e) {
      if (e.key === "Enter") loadVoucher(this.value);
    });
  </script>
</body>
</html>
