<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Printing Receipt</title>
  <link rel="stylesheet" href="printreceipt.css" />
  <!-- QR code generator (free, no install needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="page-container">
    <header class="brand-header">
      <img src="logo.png" class="brand-logo" alt="EcoNova Logo">
    </header>

    <main class="content-area">
      <div class="title-section">
        <h1>Printing <span class="accent-green">Receipt</span></h1>
        <p class="subtitle">Please wait while we print your receipt.</p>
      </div>

      <div class="printer-illustration">
        <span class="sparkle sparkle-left" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-right" aria-hidden="true">✦</span>

        <div class="printer-body">
          <div class="printer-top"></div>
          <div class="printer-container">
            <div class="printer-front">
              <div class="printer-screen"></div>
              <div class="paper-output">
                <div class="receipt-paper">
                  <div class="paper-line"></div>
                  <!-- Real QR code will be generated here -->
                  <div id="qrcode" style="width:60px;height:60px;"></div>
                </div>
              </div>
            </div>
            <div class="power-light"></div>
          </div>
        </div>

        <span class="leaf leaf-left" aria-hidden="true"></span>
        <span class="leaf leaf-right" aria-hidden="true"></span>
      </div>

      <div class="status-area">
        <p class="status-text" id="statusText">Saving your points to database...</p>
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <p class="voucher-id" id="voucherDisplay" style="font-size:12px;color:#14848B;margin-top:8px;"></p>
      </div>

      <div class="wave-background" aria-hidden="true"></div>
    </main>

    <footer class="voucher-notice">
      <div class="notice-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="#1a8f7d" stroke-width="1.5"/>
          <line x1="6" y1="9" x2="18" y2="9" stroke="#1a8f7d" stroke-width="1"/>
          <line x1="6" y1="12" x2="14" y2="12" stroke="#1a8f7d" stroke-width="1"/>
        </svg>
      </div>
      <div class="notice-text">
        <strong>Don't forget your voucher!</strong>
        <span>Scan the QR code on your next visit to continue earning points.</span>
      </div>
    </footer>
  </div>

  <script type="module">
    import { createVoucher, generateReceiptID } from './firebase-config.js';

    async function generateAndSave() {
      const statusText    = document.getElementById("statusText");
      const voucherDisplay= document.getElementById("voucherDisplay");

      // get existing voucher ID if already created during this session
      let voucherID = sessionStorage.getItem("voucherID");
      const totalPoints = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);

      // if no voucher yet (e.g. user went straight to print), create one now
      if (!voucherID) {
        voucherID = await createVoucher([], totalPoints);
        sessionStorage.setItem("voucherID", voucherID);
      }

      // generate QR code from the voucher ID
      new QRCode(document.getElementById("qrcode"), {
        text:   voucherID,
        width:  60,
        height: 60,
      });

      voucherDisplay.textContent = "Receipt ID: " + voucherID;
      statusText.textContent     = "Printing your QR voucher...";

      // redirect to print complete after 3.5 seconds
      setTimeout(function () {
        window.location.href = "printcomplete.html";
      }, 3500);
    }

    generateAndSave();
  </script>
</body>
</html>
