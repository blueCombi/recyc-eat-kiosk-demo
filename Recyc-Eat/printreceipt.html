<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Printing Receipt</title>
  <link rel="stylesheet" href="printreceipt.css" />
</head>
<body>
  <div class="page-container">
    <header class="brand-header">
      <img src="logo.png" class="brand-logo" alt="EcoNova Logo">
    </header>

    <main class="content-area">
      <div class="title-section">
        <h1>Printing <span class="accent-green">Receipt</span></h1>
        <p class="subtitle">Please wait while we print your receipt.</p>
      </div>

      <div class="printer-illustration">
        <span class="sparkle sparkle-left" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-right" aria-hidden="true">✦</span>
        
        <div class="printer-body">
          <div class="printer-top"></div>
          <div class="printer-container">
            <div class="printer-front">
              <div class="printer-screen"></div>
              <div class="paper-output">
                <div class="receipt-paper">
                  <div class="paper-line"></div>
                  <svg class="qr-display" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="50" height="50" fill="white" stroke="#333" stroke-width="1"/>
                    <rect x="8" y="8" width="12" height="12" fill="#333"/>
                    <rect x="40" y="8" width="12" height="12" fill="#333"/>
                    <rect x="8" y="40" width="12" height="12" fill="#333"/>
                    <rect x="22" y="22" width="16" height="16" fill="white" stroke="#999" stroke-width="0.5"/>
                    <circle cx="30" cy="30" r="3" fill="#2fb965"/>
                  </svg>
                </div>
              </div>
            </div>
            <div class="power-light"></div>
          </div>
        </div>

        <span class="leaf leaf-left" aria-hidden="true"></span>
        <span class="leaf leaf-right" aria-hidden="true"></span>
      </div>

      <div class="status-area">
        <p class="status-text">Printing your QR voucher...</p>
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
      </div>

      <div class="wave-background" aria-hidden="true"></div>
    </main>

    <footer class="voucher-notice">
      <div class="notice-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="#1a8f7d" stroke-width="1.5"/>
          <line x1="6" y1="9" x2="18" y2="9" stroke="#1a8f7d" stroke-width="1"/>
          <line x1="6" y1="12" x2="14" y2="12" stroke="#1a8f7d" stroke-width="1"/>
        </svg>
      </div>
      <div class="notice-text">
        <strong>Don't forget your voucher!</strong>
        <span>Present the QR code receipt when you redeem your reward.</span>
      </div>
      <div class="mini-qr" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="28" height="28" fill="white" stroke="#1a5156" stroke-width="1"/>
          <rect x="4" y="4" width="8" height="8" fill="#1a5156"/>
          <rect x="20" y="4" width="8" height="8" fill="#1a5156"/>
          <rect x="4" y="20" width="8" height="8" fill="#1a5156"/>
          <circle cx="16" cy="16" r="2" fill="#2fb965"/>
        </svg>
      </div>
    </footer>
  </div>

  <script>
    // Redirect to print complete page after progress bar animation finishes (3.5 seconds)
    setTimeout(function() {
      window.location.href = 'printcomplete.html';
    }, 3500);
  </script>
</body>
</html>
