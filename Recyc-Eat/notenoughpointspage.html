<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Enough Points</title>
    <link rel="stylesheet" href="notenoughpointspage.css" />
  </head>
  <body>
    <div class="leaf-layer" aria-hidden="true">
      <span class="leaf leaf-1"></span>
      <span class="leaf leaf-2"></span>
      <span class="leaf leaf-3"></span>
      <span class="leaf leaf-4"></span>
      <span class="leaf leaf-5"></span>
      <span class="leaf leaf-6"></span>
    </div>

    <div class="page-shell">
      <header class="header" aria-label="EcoNova brand">
        <img src="logo.png" class="logo" alt="EcoNova logo" />
      </header>

      <main class="content" role="main">
        <section class="score-ring" aria-label="Current total points 20">
          <div class="ring-orbit" aria-hidden="true">
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
            <div class="dot dot-4"></div>
            <div class="dot dot-5"></div>
            <div class="dot dot-6"></div>
            <div class="dot dot-7"></div>
            <div class="dot dot-8"></div>
            <div class="dot dot-9"></div>
            <div class="dot dot-10"></div>
            <div class="dot dot-11"></div>
            <div class="dot dot-12"></div>
          </div>

          <div class="score-center">
            <div class="score-label">Total Points</div>
            <div class="score-number">20<span class="star">★</span></div>
          </div>
        </section>

        <section class="reward-card" aria-label="Reward requirement">
          <img src="image 32.png" class="reward-icon" alt="Canned food" />
          <div class="reward-copy">
            <div class="reward-points"><span class="points-need">25</span> Points</div>
            <div class="reward-desc">=1 Canned Foods</div>
          </div>
        </section>

        <p class="notice">You need <span>5</span> more points to<br />redeem your food reward.</p>
      </main>

      <div class="actions">
        <a href="itemaccepted.html" class="btn btn-green" role="button" aria-label="Continue Recycling">
          <span class="icon-recycle">♻</span>
          <span>Continue Recycling</span>
        </a>

        <button class="btn btn-outline" type="button" aria-label="Print QR Receipt">
          <img src="image 33.png" alt="Print icon" class="print-icon" />
          <span>Print&nbsp;&nbsp;QR Receipt</span>
        </button>
      </div>
    </div>
  </body>
</html>
