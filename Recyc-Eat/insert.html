<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Insert Your Recyclable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="insert.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-backdrop" aria-hidden="true"></div>
  <div class="container">
    <header class="header">
      <img src="logo.png" class="logo" alt="Logo">
    </header>

    <h1 class="title">INSERT YOUR RECYCLABLE</h1>
    <div class="subtitle">Please Insert 1 item at a time.</div>

    <main class="main-area" role="main">
      <div class="spinner-wrap" aria-hidden="false">
        <div class="spinner" role="img" aria-label="loading spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="inner-disc">
          <div class="center-art">
            <a href="itemaccepted.html?award=1" aria-label="Continue to item accepted">
              <img src="bottlesncan.png" alt="bottle and can">
            </a>
          </div>
        </div>
      </div>

      <div class="waiting" id="waitingText" role="status" aria-live="polite">Waiting for Item...</div>
    </main>
  </div>

  <div class="controls">
    <a href="recycling.html" class="btn-cancel" role="button">CANCEL <span class="x">✕</span></a>
  </div>

  <footer class="info-bar">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or thin can to begin.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { scanVoucher } from './firebase-config.js';

    const DEFAULT_TEXT = "Waiting for Item...";
    const waitingEl    = document.getElementById("waitingText");

    function setStatus(message, isError) {
      waitingEl.textContent = message;
      waitingEl.classList.toggle("is-error", !!isError);
    }

    function resetStatus(delay) {
      setTimeout(() => setStatus(DEFAULT_TEXT, false), delay);
    }

    // Returning users arrive here from qrscan.html — confirm the voucher is
    // still valid before letting them add more items to it.
    async function resumeSession() {
      const returnID = sessionStorage.getItem("returnVoucherID");
      if (!returnID) return;

      setStatus("Loading your voucher...");

      try {
        const result = await scanVoucher(returnID);

        if (result.success) {
          sessionStorage.setItem("voucherID", returnID);
          sessionStorage.setItem("totalPoints", result.total_points);
          setStatus(`Welcome back! ${result.total_points} points loaded`);
          resetStatus(2500);
        } else {
          sessionStorage.removeItem("returnVoucherID");
          setStatus(result.message, true);
          resetStatus(3500);
        }
      } catch (err) {
        setStatus("Offline — points will sync once reconnected.", true);
        resetStatus(3500);
      }
    }

    resumeSession();
  </script>
</body>
</html>
