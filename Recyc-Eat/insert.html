<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Insert Your Recyclable</title>
  <link rel="stylesheet" href="insert.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="page-backdrop" aria-hidden="true"></div>
  <div class="container">
    <header class="header">
      <img src="logo.png" class="logo" alt="Logo">
    </header>

    <h1 class="title">INSERT YOUR RECYCLABLE</h1>
    <div class="subtitle">Please Insert 1 item at a time.</div>

    <main class="main-area" role="main">
  

      <div class="spinner-wrap" aria-hidden="false">
        <div class="spinner" role="img" aria-label="loading spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="inner-disc">
          <div class="center-art">
            <a href="itemaccepted.html?award=1" aria-label="Continue to item accepted">
              <img src="bottlesncan.png" alt="bottle and can">
            </a>
          </div>
        </div>
      </div>

      <div class="waiting">Waiting for Item...</div>
    </main>
  </div>

  <div class="controls">
    <a href="recycling.html" class="btn-cancel" role="button">CANCEL <span class="x">✕</span></a>
  </div>

  <footer class="info-bar">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or thin can to begin.</span>
  </footer>
</body>
</html>
