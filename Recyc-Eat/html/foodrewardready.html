<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Reward Ready</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/foodrewardready.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-done"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li class="is-done"><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <span class="success-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M13 25 L21 33 L36 17" fill="none" stroke="currentColor" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

      <div class="page-heading">
        <h1 class="kiosk-title">Enjoy your <em>meal!</em></h1>
        <p class="kiosk-sub">Take your can from the tray below the screen.</p>
      </div>

      <section class="kiosk-card thanks">
        <img src="../images/thankyoupic.png" alt="" class="thanks__art" aria-hidden="true">
        <div class="thanks__copy">
          <h2 class="thanks__title">Thank you for recycling with EcoNova!</h2>
          <p class="thanks__text">Your bottles and cans were kept out of landfill today.</p>
        </div>
      </section>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Returning to the start screen in <strong id="countdown">5</strong> seconds.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      // the reward is collected, so nothing from this visit should carry
      // over to whoever walks up next
      sessionStorage.removeItem("voucherID");
      sessionStorage.removeItem("returnVoucherID");
      sessionStorage.removeItem("totalPoints");
      sessionStorage.removeItem("sessionItems");

      var label = document.getElementById("countdown");
      var left  = 5;

      var tick = setInterval(function () {
        left -= 1;
        label.textContent = left > 0 ? left : 0;

        if (left <= 0) {
          clearInterval(tick);
          window.location.href = "recycling.html";
        }
      }, 1000);
    })();
  </script>
</body>
</html>
