<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispensing Food Reward</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/dispensingfood.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-done"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title">Dispensing your <em>reward</em></h1>
        <p class="kiosk-sub" id="dispenseSub">Your item is on its way from the machine.</p>
      </div>

      <div class="dispenser" aria-hidden="true">
        <div class="dispenser__head">
          <span class="dispenser__brand">EcoNova</span>
          <span class="dispenser__light"></span>
        </div>

        <div class="dispenser__window">
          <span class="dispenser__can">
            <span class="dispenser__can-lid"></span>
            <span class="dispenser__can-label" id="dispenseLabel">REWARD</span>
          </span>
        </div>

        <div class="dispenser__tray">
          <span class="dispenser__slot"></span>
        </div>
      </div>

      <div class="dispense-status">
        <p class="dispense-status__text" id="dispenseStatus" role="status" aria-live="polite">Releasing your item...</p>
        <div class="dispense-progress" aria-hidden="true">
          <div class="dispense-progress__fill"></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Collect your item from the tray below the screen.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    const name = (sessionStorage.getItem("dispenseName") || "reward").trim();
    const coil = Number(sessionStorage.getItem("dispenseCoil") || 0);
    const label = document.getElementById("dispenseLabel");
    const sub = document.getElementById("dispenseSub");
    const status = document.getElementById("dispenseStatus");

    const shortName = name.replace(/\s+/g, " ");
    label.textContent = shortName.toUpperCase();
    if (coil >= 1 && coil <= 4) {
      sub.textContent = `${shortName} is coming from coil ${coil}.`;
      status.textContent = `Releasing coil ${coil}...`;
    } else {
      sub.textContent = `${shortName} is on its way.`;
    }

    // ESP32 must be on the same LAN as the kiosk PC. Set once in this browser:
    // localStorage.setItem("econovaDispenseUrl", "http://192.168.x.x/dispense")
    const ESP32_DISPENSE_URL = (() => {
      try {
        return localStorage.getItem("econovaDispenseUrl") || "";
      } catch {
        return "";
      }
    })();
    async function requestDispense(coilNumber) {
      if (!ESP32_DISPENSE_URL || !coilNumber) return;
      await fetch(ESP32_DISPENSE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ coilNumber }),
      });
    }

    requestDispense(coil).catch((err) => {
      console.warn("ESP32 dispense skipped:", err.message);
    });

    setTimeout(function () {
      window.location.href = "foodrewardready.html";
    }, 4000);
  </script>
</body>
</html>
