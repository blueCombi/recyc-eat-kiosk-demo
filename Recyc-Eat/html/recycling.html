<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Start Recycling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/recycling.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <a href="login.html" class="signin-link" aria-label="Staff sign in" title="Staff sign in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </a>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <div class="page-heading">
        <h1 class="kiosk-title">Turn Recyclables<br>into <em>Food!</em></h1>
        <p class="kiosk-sub">Drop in bottles or cans, collect points, take home a meal.</p>
      </div>

      <img src="../images/RecycleBin.jpg" alt="Bottles and cans in a recycling bin" class="hero-art">

      <div class="start-actions">
        <a href="howto.html" class="kiosk-btn kiosk-btn--primary kiosk-btn--lg" role="button">
          START RECYCLING <span aria-hidden="true">&rarr;</span>
        </a>

        <a href="qrscan.html" class="kiosk-btn kiosk-btn--ghost" role="button">
          <img src="../images/qrIcon.png" alt="" class="qr-icon" aria-hidden="true">
          SCAN QR RECEIPT
        </a>
      </div>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>New here? Tap Start Recycling. Returning? Scan your QR receipt to keep your points.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { loadKioskSettings } from "../js/kiosk-settings-data.js";

    try {
      const settings = await loadKioskSettings();
      if (settings.kioskOpen) return;

      document.querySelector(".start-actions").hidden = true;
      document.querySelector(".kiosk-title").innerHTML = "Temporarily <em>Closed</em>";
      document.querySelector(".kiosk-sub").textContent =
        "This kiosk is not taking items right now. Please check back later.";
      document.querySelector(".kiosk-info span:last-child").textContent =
        "Staff can still sign in from the icon in the corner.";
    } catch (err) {
      console.error("Could not read kiosk open/closed setting:", err);
    }
  </script>
</body>
</html>
