<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Congratulations - Redeem Reward</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/redeemready.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell kiosk-shell--wide">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-done"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title redeem-title" id="pageTitle">Choose your reward</h1>
        <p class="kiosk-sub" id="pageSub">Button 1 is coil 1. Pick one item, then tap REDEEM.</p>
      </div>

      <div class="redeem-row">
        <div class="kiosk-ring redeem-ring">
          <div class="kiosk-ring__orbit" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="kiosk-ring__disc">
            <span class="points-label">Total Points</span>
            <span class="points-value">
              <span id="totalPoints">0</span><span class="star" aria-hidden="true">★</span>
            </span>
          </div>
        </div>

        <div class="reward-grid" id="rewardGrid" role="listbox" aria-label="Rewards by coil"></div>
      </div>

      <button class="kiosk-btn kiosk-btn--primary kiosk-btn--lg redeem-btn" id="redeemBtn" type="button" disabled>
        <span aria-hidden="true">&#127873;</span>
        <span id="redeemLabel">REDEEM</span>
      </button>

      <a class="kiosk-btn kiosk-btn--ghost redeem-keep" id="keepBtn" href="insert.html">
        KEEP RECYCLING
      </a>

      <a class="kiosk-btn kiosk-btn--ghost redeem-print" id="printBtn" href="printreceipt.html">
        PRINT QR RECEIPT
      </a>

      <p class="redeem-error" id="redeemMsg" role="alert" hidden></p>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span id="kioskInfo">Collect your item from the tray below the screen.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { POINTS, redeemReward, ensureVoucherMatchesSession } from '../js/firebase-config.js';
    import { loadKioskSettings, applySettingsToPoints } from '../js/kiosk-settings-data.js';
    import { loadCoilInventory, UNAVAILABLE_MESSAGE } from '../js/food-inventory-data.js';

    try {
      applySettingsToPoints(POINTS, await loadKioskSettings());
    } catch (err) {
      console.error("Using default point values:", err);
    }

    const button = document.getElementById("redeemBtn");
    const label  = document.getElementById("redeemLabel");
    const error  = document.getElementById("redeemMsg");
    const grid = document.getElementById("rewardGrid");

    let total = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
    if (isNaN(total) || total < 0) total = 0;
    document.getElementById("totalPoints").textContent = total;

    let coils = [];
    let selectedSku = null;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function tileState(item) {
      if (item.qty <= 0) return { disabled: true, note: "Out of stock" };
      if (total < item.pointCost) return { disabled: true, note: `Need ${item.pointCost} points` };
      return { disabled: false, note: `${item.qty} left` };
    }

    function showUnavailable(message) {
      document.getElementById("pageTitle").textContent = "Sorry, rewards are temporarily unavailable";
      document.getElementById("pageTitle").classList.add("is-unavailable");
      document.getElementById("pageSub").textContent = "Keep your points. Staff need to restock the machine.";
      button.hidden = true;
      document.getElementById("kioskInfo").textContent =
        "Keep recycling for a pricier item, or print your QR receipt and come back later.";
      if (message) {
        error.textContent = message;
        error.hidden = false;
      }
    }

    function renderTiles() {
      const anyOpen = coils.some((item) => !tileState(item).disabled);
      grid.innerHTML = coils.map((item) => {
        const state = tileState(item);
        const selected = !state.disabled && item.sku === selectedSku;
        return `<button type="button" class="reward-tile${state.disabled ? " is-disabled" : ""}${selected ? " is-selected" : ""}"
            role="option" aria-selected="${selected ? "true" : "false"}"
            data-sku="${item.sku}" ${state.disabled ? "disabled" : ""}>
            <span class="reward-tile__coil">Coil ${item.coilNumber}</span>
            <span class="reward-tile__name">${escapeHtml(item.name)}</span>
            <span class="reward-tile__cost">${item.pointCost} points</span>
            <span class="reward-tile__note">${state.note}</span>
          </button>`;
      }).join("");

      if (!anyOpen) {
        selectedSku = null;
        showUnavailable(UNAVAILABLE_MESSAGE);
        return;
      }

      document.getElementById("pageTitle").classList.remove("is-unavailable");
      button.hidden = false;
      const selected = coils.find((item) => item.sku === selectedSku && !tileState(item).disabled);
      button.disabled = !selected;
      label.textContent = selected ? `REDEEM ${selected.name.toUpperCase()}` : "REDEEM";
    }

    try {
      coils = await loadCoilInventory();
      selectedSku = null;
      renderTiles();
    } catch (err) {
      console.error("Could not read rewards:", err);
      showUnavailable("Could not load rewards. Try again.");
    }

    grid.addEventListener("click", (event) => {
      const tile = event.target.closest("[data-sku]");
      if (!tile || tile.disabled) return;
      selectedSku = tile.getAttribute("data-sku");
      error.hidden = true;
      renderTiles();
    });

    function dispense(result) {
      sessionStorage.setItem("dispenseName", result.item || selectedSku);
      sessionStorage.setItem("dispenseSku", result.sku || selectedSku);
      sessionStorage.setItem("dispenseCoil", String(result.coilNumber || ""));
      sessionStorage.removeItem("voucherID");
      sessionStorage.removeItem("totalPoints");
      sessionStorage.removeItem("sessionItems");
      window.location.href = "dispensingfood.html";
    }

    button.addEventListener("click", async function () {
      const item = coils.find((entry) => entry.sku === selectedSku);
      if (!item || tileState(item).disabled) {
        error.textContent = "Pick a reward you can redeem.";
        error.hidden = false;
        return;
      }

      button.disabled = true;
      error.hidden = true;
      label.textContent = "Processing...";

      let voucherID = sessionStorage.getItem("voucherID");
      let sessionItems = [];
      try { sessionItems = JSON.parse(sessionStorage.getItem("sessionItems") || "[]"); }
      catch { sessionItems = []; }

      try {
        voucherID = await ensureVoucherMatchesSession(voucherID, total, sessionItems);
        if (voucherID) sessionStorage.setItem("voucherID", voucherID);

        const result = await redeemReward(voucherID, item.sku);
        if (!result.success) {
          if (result.code === "unavailable") {
            coils = await loadCoilInventory();
            selectedSku = coils.find((entry) => !tileState(entry).disabled)?.sku || null;
            renderTiles();
            error.textContent = result.message || UNAVAILABLE_MESSAGE;
            error.hidden = false;
            return;
          }
          error.textContent = result.message || "Could not redeem right now.";
          error.hidden = false;
          button.disabled = false;
          renderTiles();
          return;
        }
        dispense(result);
        return;
      } catch (err) {
        console.error("Redeem failed:", err);
        error.textContent = "Could not reach the dispenser. Try again.";
        error.hidden = false;
        button.disabled = false;
        renderTiles();
      }
    });
  </script>
</body>
</html>
