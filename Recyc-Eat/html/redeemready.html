<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Congratulations - Redeem Reward</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/redeemready.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-done"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title redeem-title" id="pageTitle">Congratulations!</h1>
        <p class="kiosk-sub" id="pageSub">You have enough points for a free canned meal.</p>
      </div>

      <div class="redeem-row">
        <div class="kiosk-ring redeem-ring">
          <div class="kiosk-ring__orbit" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="kiosk-ring__disc">
            <span class="points-label">Total Points</span>
            <span class="points-value">
              <span id="totalPoints">0</span><span class="star" aria-hidden="true">★</span>
            </span>
          </div>
        </div>

        <section class="kiosk-card reward">
          <img src="../images/reward.png" alt="" class="reward__art" aria-hidden="true">
          <h2 class="reward__title" id="rewardTitle">1 free canned meal</h2>
          <p class="reward__desc" id="rewardDesc">Tuna or sardines, whichever is loaded today.</p>
          <p class="reward__cost"><strong id="rewardCost">50</strong> points</p>
        </section>
      </div>

      <button class="kiosk-btn kiosk-btn--primary kiosk-btn--lg redeem-btn" id="redeemBtn" type="button">
        <span aria-hidden="true">&#127873;</span>
        <span id="redeemLabel">REDEEM</span>
      </button>

      <a class="kiosk-btn kiosk-btn--ghost redeem-print" id="printBtn" href="printreceipt.html" hidden>
        PRINT QR RECEIPT
      </a>

      <p class="redeem-error" id="redeemMsg" role="alert" hidden></p>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Collect your can from the tray below the screen.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { POINTS, redeemReward, ensureVoucherMatchesSession } from '../js/firebase-config.js';
    import { loadKioskSettings, applySettingsToPoints } from '../js/kiosk-settings-data.js';
    import { getLoadedReward, UNAVAILABLE_MESSAGE } from '../js/food-inventory-data.js';

    try {
      applySettingsToPoints(POINTS, await loadKioskSettings());
    } catch (err) {
      console.error("Using default point values:", err);
    }

    const button = document.getElementById("redeemBtn");
    const label  = document.getElementById("redeemLabel");
    const error  = document.getElementById("redeemMsg");
    const printBtn = document.getElementById("printBtn");

    let total = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
    if (isNaN(total) || total < 0) total = 0;

    document.getElementById("totalPoints").textContent = total;
    document.getElementById("rewardCost").textContent  = POINTS.threshold;

    function showUnavailable(message, loaded) {
      document.getElementById("pageTitle").textContent = "Sorry, this reward is temporarily unavailable";
      document.getElementById("pageTitle").classList.add("is-unavailable");
      document.getElementById("pageSub").textContent = "Keep your points. Staff need to restock the machine.";
      document.getElementById("rewardTitle").textContent = loaded?.name
        ? `${loaded.name} is out of stock`
        : "No can loaded";
      document.getElementById("rewardDesc").textContent = message || UNAVAILABLE_MESSAGE;
      button.hidden = true;
      printBtn.hidden = false;
      document.querySelector(".kiosk-info span:last-child").textContent =
        "Print your QR receipt and come back after the machine is restocked.";
    }

    try {
      const loaded = await getLoadedReward();
      if (!loaded || loaded.qty < 1) {
        showUnavailable(UNAVAILABLE_MESSAGE, loaded);
      } else {
        document.getElementById("rewardTitle").textContent = `1 free ${loaded.name}`;
        document.getElementById("rewardDesc").textContent =
          `${loaded.name} is loaded today. ${loaded.qty} left in the machine.`;
      }
    } catch (err) {
      console.error("Could not read loaded reward:", err);
    }

    function dispense() {
      sessionStorage.removeItem("voucherID");
      sessionStorage.removeItem("totalPoints");
      sessionStorage.removeItem("sessionItems");
      window.location.href = "dispensingfood.html";
    }

    button.addEventListener("click", async function () {
      if (total < POINTS.threshold) {
        error.textContent = `Not enough points. You need ${POINTS.threshold}.`;
        error.hidden = false;
        return;
      }

      button.disabled = true;
      error.hidden = true;
      label.textContent = "Processing...";

      let voucherID = sessionStorage.getItem("voucherID");
      let sessionItems = [];
      try { sessionItems = JSON.parse(sessionStorage.getItem("sessionItems") || "[]"); }
      catch { sessionItems = []; }

      try {
        voucherID = await ensureVoucherMatchesSession(voucherID, total, sessionItems);
        if (voucherID) sessionStorage.setItem("voucherID", voucherID);

        const result = await redeemReward(voucherID, "canned_food");
        if (!result.success) {
          if (result.code === "unavailable") {
            showUnavailable(result.message);
            return;
          }
          error.textContent = result.message || "Could not redeem right now.";
          error.hidden = false;
          button.disabled = false;
          label.textContent = "REDEEM";
          return;
        }
      } catch (err) {
        console.error("Redeem failed:", err);
        error.textContent = "Could not reach the dispenser. Try again.";
        error.hidden = false;
        button.disabled = false;
        label.textContent = "REDEEM";
        return;
      }

      dispense();
    });
  </script>
</body>
</html>
