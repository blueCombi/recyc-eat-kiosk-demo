<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoNova Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <div class="page-heading">
        <h1 class="kiosk-title">EcoNova <em>Admin Portal</em></h1>
        <p class="kiosk-sub">Manage your kiosk, collections, rewards, and inventory.</p>
      </div>

      <form class="kiosk-card login-card" id="loginForm" novalidate>
        <div class="login-field">
          <label class="login-label" for="email">Email</label>
          <input
            class="login-input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
            required
          />
        </div>

        <div class="login-field">
          <div class="login-label-row">
            <label class="login-label" for="password">Password</label>
            <a href="#" class="login-forgot" id="forgotPassword">Forgot password?</a>
          </div>
          <div class="login-password-wrap">
            <input
              class="login-input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              class="login-toggle"
              type="button"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="login-toggle__icon login-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 5c-5.5 0-9.5 4.5-10.8 6.2a1.2 1.2 0 0 0 0 1.6C2.5 14.5 6.5 19 12 19s9.5-4.5 10.8-6.2a1.2 1.2 0 0 0 0-1.6C21.5 9.5 17.5 5 12 5zm0 12c-3.9 0-7.1-3-8.5-4.7C4.9 10.6 8.1 8 12 8s7.1 2.6 8.5 4.3C19.1 14 15.9 17 12 17zm0-8a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/>
              </svg>
              <svg class="login-toggle__icon login-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path fill="currentColor" d="M3.3 2.3 2 3.6l3.1 3.1C3.4 8.2 2.1 9.8 1.2 11a1.2 1.2 0 0 0 0 1.6C2.5 14.5 6.5 19 12 19c2 0 3.8-.5 5.3-1.3l3.1 3.1 1.3-1.3L3.3 2.3zM12 17c-3.9 0-7.1-3-8.5-4.7.7-.9 2-2.3 3.7-3.3l1.6 1.6A3.5 3.5 0 0 0 12 15.5c.4 0 .7-.1 1-.2l1.5 1.5c-.8.2-1.6.2-2.5.2zm8.8-4.4c-.5.6-1.2 1.4-2.1 2.2l-1.4-1.4c.9-.7 1.6-1.5 2.1-2.1C19.1 10 15.9 7 12 7c-.6 0-1.1.1-1.6.2L8.9 5.7C9.9 5.3 10.9 5 12 5c5.5 0 9.5 4.5 10.8 6.2a1.2 1.2 0 0 1 0 1.4z"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="login-error" id="loginError" role="alert" hidden></p>

        <button class="kiosk-btn kiosk-btn--primary kiosk-btn--lg login-submit" type="submit" id="loginBtn">
          LOG IN <span aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <p class="login-alt">
        Looking for the Recyc-Eat Kiosk?
        <a href="recycling.html">Go to recycling screen</a>
      </p>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Authorized staff only. Sign in to manage EcoNova kiosk operations.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    // ── Firebase config ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyCAQZstw1qOUltsN_HKPZE7qNI2uRRWpwU",
      authDomain: "recyc-eat.firebaseapp.com",
      projectId: "recyc-eat",
      storageBucket: "recyc-eat.firebasestorage.app",
      messagingSenderId: "45738414086",
      appId: "1:45738414086:web:90b0f800476683c77d3387"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ── If already logged in, skip to dashboard ──────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    // ── DOM refs ─────────────────────────────────────────────────
    const form      = document.getElementById("loginForm");
    const emailEl   = document.getElementById("email");
    const passEl    = document.getElementById("password");
    const errorEl   = document.getElementById("loginError");
    const loginBtn  = document.getElementById("loginBtn");
    const toggle    = document.getElementById("togglePassword");
    const showIcon  = toggle.querySelector(".login-toggle__icon--show");
    const hideIcon  = toggle.querySelector(".login-toggle__icon--hide");
    const forgotBtn = document.getElementById("forgotPassword");

    // ── Password show/hide ───────────────────────────────────────
    toggle.addEventListener("click", () => {
      const revealing = passEl.type === "password";
      passEl.type = revealing ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(revealing));
      toggle.setAttribute("aria-label", revealing ? "Hide password" : "Show password");
      showIcon.hidden = revealing;
      hideIcon.hidden = !revealing;
    });

    // ── Show error helper ────────────────────────────────────────
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    function clearError() {
      errorEl.hidden = true;
      errorEl.textContent = "";
    }

    // ── Friendly Firebase error messages ─────────────────────────
    function friendlyError(code) {
      switch (code) {
        case "auth/invalid-email":          return "Please enter a valid email address.";
        case "auth/user-not-found":         return "No account found with that email.";
        case "auth/wrong-password":         return "Incorrect password. Please try again.";
        case "auth/invalid-credential":     return "Incorrect email or password. Please try again.";
        case "auth/too-many-requests":      return "Too many failed attempts. Please try again later.";
        case "auth/network-request-failed": return "Network error. Please check your connection.";
        default:                            return "Login failed. Please try again.";
      }
    }

    // ── Login form submit ─────────────────────────────────────────
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const emailVal = emailEl.value.trim();
      const passVal  = passEl.value;

      if (!emailVal || !passVal) {
        showError("Please enter your email and password.");
        return;
      }

      // show loading state
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";

      try {
        await signInWithEmailAndPassword(auth, emailVal, passVal);
        // onAuthStateChanged above will redirect to dashboard
      } catch (err) {
        showError(friendlyError(err.code));
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'LOG IN <span aria-hidden="true">&rarr;</span>';
      }
    });

    // ── Forgot password ───────────────────────────────────────────
    forgotBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const emailVal = emailEl.value.trim();

      if (!emailVal) {
        showError("Enter your email address first, then click Forgot password.");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, emailVal);
        clearError();
        errorEl.style.color = "var(--teal-700)";
        errorEl.textContent = "Password reset email sent! Check your inbox.";
        errorEl.hidden = false;
      } catch (err) {
        showError(friendlyError(err.code));
      }
    });
  </script>
</body>
</html>
