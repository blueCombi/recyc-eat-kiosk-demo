<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Item Rejected</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/itemrejected.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <div class="reject-status">
        <span class="reject-mark" aria-hidden="true">!</span>
        <h1 class="kiosk-title reject-title">Item Rejected</h1>
        <p class="kiosk-sub">Your item has been returned. Nothing was charged to your points.</p>
      </div>

      <div class="kiosk-ring reject-ring">
        <div class="kiosk-ring__orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="kiosk-ring__disc">
          <div class="kiosk-ring__art">
            <img src="../images/bottlesncan.png" alt="A plastic bottle and an aluminum can">
          </div>
        </div>
      </div>

      <ul class="reject-reasons kiosk-card">
        <li>Remove the cap before inserting.</li>
        <li>Empty any liquid left inside.</li>
        <li>Only plastic bottles and thin aluminum cans are accepted.</li>
      </ul>

      <div class="reject-actions">
        <a href="insert.html" class="kiosk-btn kiosk-btn--primary kiosk-btn--lg" role="button">
          TRY AGAIN <span aria-hidden="true">&#8635;</span>
        </a>

        <button type="button" id="finishBtn" class="kiosk-btn kiosk-btn--danger">
          <span id="finishLabel">CANCEL</span> <span aria-hidden="true">&#10005;</span>
        </button>
      </div>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Still not working? Ask our staff for help.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { POINTS } from '../js/firebase-config.js';
    import { loadKioskSettings, applySettingsToPoints } from '../js/kiosk-settings-data.js';

    try {
      applySettingsToPoints(POINTS, await loadKioskSettings());
    } catch (err) {
      console.error("Using default point values:", err);
    }

    // Stopping here shouldn't throw away points already earned, so this
    // button follows the same routing as FINISH on itemaccepted.html.
    const button = document.getElementById("finishBtn");
    const label  = document.getElementById("finishLabel");

    let total = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
    if (isNaN(total) || total < 0) total = 0;

    let target = "recycling.html";

    if (total >= POINTS.threshold) {
      target = "redeemready.html";
      label.textContent = "FINISH & REDEEM";
      button.classList.replace("kiosk-btn--danger", "kiosk-btn--ghost");
    } else if (total > 0) {
      target = "notenoughpoints.html";
      label.textContent = "FINISH & PRINT QR";
      button.classList.replace("kiosk-btn--danger", "kiosk-btn--ghost");
    }

    button.addEventListener("click", () => {
      sessionStorage.setItem("totalPoints", total);
      window.location.href = target;
    });
  </script>
</body>
</html>
