<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Insert Your Recyclable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/insert.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title">Insert Your <em>Recyclable</em></h1>
        <p class="kiosk-sub">Please insert one item at a time.</p>
      </div>

      <div class="kiosk-ring insert-ring">
        <div class="kiosk-ring__orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="kiosk-ring__disc">
          <div class="kiosk-ring__art">
            <img src="../images/bottlesncan.png" alt="A plastic bottle and an aluminum can">
          </div>
        </div>
      </div>

      <p class="insert-status" id="waitingText" role="status" aria-live="polite">Waiting for Item...</p>

      <div class="redeem-choice" id="redeemChoice" hidden>
        <p class="kiosk-title redeem-choice__title">You have <span id="redeemChoicePoints">0</span> points</p>
        <p class="kiosk-sub redeem-choice__sub">Redeem a reward now, or keep inserting.</p>
        <div class="redeem-choice__actions">
          <button type="button" class="kiosk-btn kiosk-btn--primary kiosk-btn--lg" id="btnRedeem">Redeem</button>
          <button type="button" class="kiosk-btn kiosk-btn--ghost kiosk-btn--lg" id="btnContinue">Continue</button>
        </div>
      </div>

      <a href="recycling.html" class="kiosk-btn kiosk-btn--ghost" id="cancelVisit" role="button">
        CANCEL <span aria-hidden="true">&#10005;</span>
      </a>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or thin aluminum can to begin.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { POINTS, scanVoucher } from '../js/firebase-config.js';
    import { loadKioskSettings, applySettingsToPoints } from '../js/kiosk-settings-data.js';
    import { getMinRewardCost } from '../js/food-inventory-data.js';
    import { clearKioskSession, captureReturnFromQuery, takeReturnVisit } from '../js/kiosk-session.js';
    import { connectBin } from '../js/hardware-client.js';
    import { itemTypeFor } from '../js/item-types.js';

    const DEFAULT_TEXT = "Waiting for Item...";
    const waitingEl    = document.getElementById("waitingText");

    // The voucher messages below matter more than the bin's idle chatter, so
    // they hold the line for a moment before hardware status takes it back.
    let statusHeldUntil = 0;

    function setStatus(message, isError, holdMs = 0) {
      waitingEl.textContent = message;
      waitingEl.classList.toggle("is-error", !!isError);
      if (holdMs) statusHeldUntil = Date.now() + holdMs;
    }

    function resetStatus(delay) {
      setTimeout(() => setStatus(DEFAULT_TEXT, false), delay);
    }

    let resumeAbandoned = false;
    window.addEventListener("pagehide", () => { resumeAbandoned = true; });

    document.getElementById("cancelVisit")?.addEventListener("click", () => {
      resumeAbandoned = true;
      clearKioskSession();
    });

    document.getElementById("btnContinue")?.addEventListener("click", () => {
      document.getElementById("redeemChoice").hidden = true;
      setStatus("Drop the next bottle or can.", false);
    });

    document.getElementById("btnRedeem")?.addEventListener("click", () => {
      goTo("redeemready.html");
    });

    // Returning users arrive here from qrscan.html only. Start Recycling
    // and Cancel drop resumeVisit, so leftover points cannot come back.
    async function loadOfferPoint() {
      try {
        applySettingsToPoints(POINTS, await loadKioskSettings());
      } catch (err) {
        console.error("Using default point values:", err);
      }
      try {
        const minCost = await getMinRewardCost();
        if (minCost > POINTS.threshold) POINTS.threshold = minCost;
      } catch (err) {
        console.error("Using settings threshold:", err);
      }
    }

    function offerRedeemChoice(total) {
      if (total < POINTS.threshold) return;
      document.getElementById("redeemChoicePoints").textContent = String(total);
      document.getElementById("redeemChoice").hidden = false;
    }

    async function resumeSession() {
      captureReturnFromQuery();
      await loadOfferPoint();
      if (!takeReturnVisit()) {
        sessionStorage.removeItem("returnVoucherID");
        const stored = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
        if (stored >= POINTS.threshold) offerRedeemChoice(stored);
        return;
      }

      const returnID = sessionStorage.getItem("returnVoucherID");
      if (!returnID) return;

      setStatus("Loading your voucher...", false, 2600);

      try {
        const result = await scanVoucher(returnID);
        if (resumeAbandoned) return;

        if (result.success) {
          sessionStorage.removeItem("returnVoucherID");
          sessionStorage.setItem("voucherID", returnID);
          sessionStorage.setItem("totalPoints", result.total_points);
          setStatus(`Welcome back! ${result.total_points} points loaded`, false);
          if (result.total_points >= POINTS.threshold) {
            offerRedeemChoice(result.total_points);
          } else {
            resetStatus(2500);
          }
        } else {
          sessionStorage.removeItem("returnVoucherID");
          setStatus(result.message, true, 3600);
          resetStatus(3500);
        }
      } catch (err) {
        if (resumeAbandoned) return;
        setStatus("Offline — points will sync once reconnected.", true, 3600);
        resetStatus(3500);
      }
    }

    resumeSession();

    // ── the bin drives this screen ─────────────────────────────────
    // Points are only ever awarded for an item the sorting ESP32 accepted, so
    // there is nothing to tap here: the bin either takes the item or returns it.
    let leaving = false;
    let bin = null;

    function goTo(url) {
      if (leaving) return;
      leaving = true;
      bin?.close();
      window.location.href = url;
    }

    bin = connectBin({
      onStatus(message) {
        if (leaving || Date.now() < statusHeldUntil) return;
        if (!message.bin.connected) {
          setStatus("Bin is offline — please ask our staff.", true);
          return;
        }
        if (message.bin.state === "busy") {
          setStatus("Sorting the last item — one moment...", false);
          return;
        }
        setStatus(DEFAULT_TEXT, false);
      },

      onDetect(message) {
        if (leaving) return;
        const grams = message.weight ? ` (${message.weight} g)` : "";
        setStatus(`Checking your item${grams}...`, false, 4000);
      },

      // The bin has already weighed, identified and kept the item. An item the
      // app has no point value for is returned rather than silently dropped.
      onItem(message) {
        const type = itemTypeFor(message.material, message.size);
        if (!type) {
          goTo("itemrejected.html?reason=UNKNOWN_ITEM");
          return;
        }
        sessionStorage.setItem("pendingInsert", JSON.stringify({
          key: type.key,
          material: message.material,
          size: message.size,
          weight: message.weight,
          at: message.at,
        }));
        // Item Accepted shows immediately. That screen asks them to wait
        // until the compressor and servo finish.
        setStatus("Item accepted!", false, 4000);
        goTo("itemaccepted.html?award=1");
      },

      onReject(message) {
        setStatus(message.message || "Item returned.", true, 4000);
        goTo(`itemrejected.html?reason=${encodeURIComponent(message.reason || "UNKNOWN_ITEM")}`);
      },

      onOffline() {
        if (leaving || Date.now() < statusHeldUntil) return;
        setStatus("Waiting for the kiosk hardware...", true);
      },
    });

    window.addEventListener("pagehide", () => bin?.close());
  </script>
</body>
</html>
