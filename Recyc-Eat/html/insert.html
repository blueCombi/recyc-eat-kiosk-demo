<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Insert Your Recyclable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/insert.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title">Insert Your <em>Recyclable</em></h1>
        <p class="kiosk-sub">Please insert one item at a time.</p>
      </div>

      <div class="kiosk-ring insert-ring">
        <div class="kiosk-ring__orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="kiosk-ring__disc">
          <a href="itemaccepted.html?award=1" class="kiosk-ring__art" id="insertArt"
             aria-label="Simulate inserting an item, double tap to simulate a rejected item">
            <img src="../images/bottlesncan.png" alt="A plastic bottle and an aluminum can">
          </a>
        </div>
      </div>

      <p class="insert-status" id="waitingText" role="status" aria-live="polite">Waiting for Item...</p>

      <a href="recycling.html" class="kiosk-btn kiosk-btn--ghost" role="button">
        CANCEL <span aria-hidden="true">&#10005;</span>
      </a>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or thin aluminum can to begin.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { scanVoucher } from '../js/firebase-config.js';

    const DEFAULT_TEXT = "Waiting for Item...";
    const waitingEl    = document.getElementById("waitingText");

    function setStatus(message, isError) {
      waitingEl.textContent = message;
      waitingEl.classList.toggle("is-error", !!isError);
    }

    function resetStatus(delay) {
      setTimeout(() => setStatus(DEFAULT_TEXT, false), delay);
    }

    // Returning users arrive here from qrscan.html — confirm the voucher is
    // still valid before letting them add more items to it.
    async function resumeSession() {
      const returnID = sessionStorage.getItem("returnVoucherID");
      if (!returnID) return;

      setStatus("Loading your voucher...");

      try {
        const result = await scanVoucher(returnID);

        if (result.success) {
          sessionStorage.setItem("voucherID", returnID);
          sessionStorage.setItem("totalPoints", result.total_points);
          setStatus(`Welcome back! ${result.total_points} points loaded`);
          resetStatus(2500);
        } else {
          sessionStorage.removeItem("returnVoucherID");
          setStatus(result.message, true);
          resetStatus(3500);
        }
      } catch (err) {
        setStatus("Offline — points will sync once reconnected.", true);
        resetStatus(3500);
      }
    }

    resumeSession();

    // Same convention as itemaccepted.html: one tap means the bin took the
    // item, two taps mean it spat it back out. The timer is what tells them
    // apart, since a double tap also fires a first click.
    const insertArt = document.getElementById("insertArt");
    let tapTimer = null;
    let leaving  = false;

    insertArt.addEventListener("click", (event) => {
      event.preventDefault();
      if (leaving || tapTimer) return;

      tapTimer = setTimeout(() => {
        tapTimer = null;
        leaving  = true;
        window.location.href = insertArt.getAttribute("href");
      }, 260);
    });

    insertArt.addEventListener("dblclick", (event) => {
      event.preventDefault();
      if (leaving) return;

      clearTimeout(tapTimer);
      tapTimer = null;
      leaving  = true;

      setStatus("Item not recognised — returning it.", true);
      setTimeout(() => { window.location.href = "itemrejected.html"; }, 600);
    });
  </script>
</body>
</html>
