<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Item Accepted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/itemaccepted.css">
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <!-- starts idle: the wording only claims an item was taken once one was -->
      <div class="accept-status is-idle" id="acceptStatus" role="status" aria-live="polite">
        <span class="accept-check" aria-hidden="true">&check;</span>
        <h1 class="kiosk-title accept-title" id="acceptTitle">Ready for your item</h1>
        <p class="accept-gain">+<span id="gainValue">5</span> points!</p>
      </div>

      <div class="kiosk-ring points-ring">
        <span class="kiosk-ring__orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </span>
        <span class="kiosk-ring__disc">
          <span class="points-label">Total Points</span>
          <span class="points-value">
            <span id="totalPoints">0</span><span class="star" aria-hidden="true">&#9733;</span>
          </span>
        </span>
      </div>

      <div class="item-toggle item-chip" id="itemChip" hidden>
        <span class="item-toggle__art">
          <img src="../images/bottle.png" alt="Small plastic bottle" id="itemIcon">
        </span>
        <span class="item-toggle__label" id="itemBadge">Small Plastic Bottle</span>
      </div>

      <p class="accept-bin-status" id="binStatus" role="status" aria-live="polite">You can drop the next bottle.</p>

      <div class="processing" id="processing" hidden>
        <span class="processing__spin" aria-hidden="true"></span>
        <p class="processing__sub">Don't insert another item until this finishes.</p>
      </div>

      <button type="button" class="kiosk-btn kiosk-btn--primary kiosk-btn--lg" id="btnFinish">
        <span id="finishLabel">FINISH</span> <span aria-hidden="true">&check;</span>
      </button>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span id="kioskHint">Wait until the machine finishes dropping the item before you insert another.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/kiosk-guard.js"></script>
  <script type="module">
    import { POINTS, createVoucher, addPoints, scanVoucher } from '../js/firebase-config.js';
    import { loadKioskSettings, applySettingsToPoints } from '../js/kiosk-settings-data.js';
    import { getMinRewardCost } from '../js/food-inventory-data.js';
    import { itemTypeByKey, itemTypeFor } from '../js/item-types.js';
    import { connectBin } from '../js/hardware-client.js';

    let totalPoints  = 0;
    let sessionItems = [];   // track items inserted this session
    let voucherID    = sessionStorage.getItem("voucherID") || null;
    let redirecting  = false;
    let bin          = null;
    let dropping     = false;
    let dropTimer    = null;

    const totalEl   = document.getElementById("totalPoints");
    const gainEl    = document.getElementById("gainValue");
    const status    = document.getElementById("acceptStatus");
    const statusTitle = document.getElementById("acceptTitle");
    const finishBtn = document.getElementById("btnFinish");
    const finishLabel = document.getElementById("finishLabel");
    const itemChip  = document.getElementById("itemChip");
    const itemIcon  = document.getElementById("itemIcon");
    const itemBadge = document.getElementById("itemBadge");
    const binStatus = document.getElementById("binStatus");

    // ── render ────────────────────────────────────────────────────
    function render(total, gain) {
      totalEl.textContent = total;
      gainEl.textContent  = gain;
      totalEl.parentElement.classList.remove("pop");
      void totalEl.parentElement.offsetWidth;
      totalEl.parentElement.classList.add("pop");
    }

    function setHeading(mode, title) {
      status.classList.toggle("is-idle", mode === "idle");
      status.classList.toggle("is-insert", mode === "insert");
      status.classList.toggle("is-wait", mode === "wait");
      statusTitle.textContent = title;
    }

    function announceAccepted() {
      setHeading("accepted", "Item Accepted!");
    }

    function setBinStatus(message, isError) {
      binStatus.textContent = message;
      binStatus.classList.toggle("is-error", !!isError);
    }

    const processingEl = document.getElementById("processing");
    let acceptHold = null;
    // Long enough to read "Item Accepted" before the compressor message.
    // The bin itself waits 5s before the motor starts.
    const ACCEPTED_HOLD_MS = 2000;

    function showProcessing() {
      dropping = true;
      processingEl.hidden = false;
      setHeading("wait", "Please wait");
      setBinStatus("Processing your item");
      clearTimeout(dropTimer);
      dropTimer = setTimeout(() => {
        if (dropping) showReadyForNext();
      }, 25000);
    }

    function showAcceptedThenProcessing() {
      dropping = true;
      processingEl.hidden = true;
      announceAccepted();
      setBinStatus("Item accepted.");
      clearTimeout(acceptHold);
      clearTimeout(dropTimer);
      acceptHold = setTimeout(() => {
        if (dropping) showProcessing();
      }, ACCEPTED_HOLD_MS);
    }

    function showReadyForNext() {
      dropping = false;
      clearTimeout(acceptHold);
      clearTimeout(dropTimer);
      processingEl.hidden = true;
      setHeading("insert", "Please insert");
      setBinStatus("Drop the next bottle, or tap FINISH.");
    }

    // The chip reports the item the bin just took, so it stays hidden until one
    // actually goes in.
    function showItem(type, points) {
      itemIcon.src    = type.img;
      itemIcon.alt    = type.alt;
      itemBadge.textContent = type.label;
      gainEl.textContent    = points;
      itemChip.hidden = false;
    }

    // A Firestore write does not fail when the kiosk loses internet — it stays
    // pending until the connection returns. Waiting on it forever would strand
    // the shopper here with points they cannot spend, so FINISH moves on either
    // way: the running total lives in sessionStorage, and Redeem and Print both
    // reconcile the receipt once the network is back.
    const SAVE_WAIT_MS = 4000;

    // Points keep counting until they tap FINISH. Do not jump to Redeem
    // automatically — they may want a pricier coil.
    function goAfterWrites(url) {
      Promise.race([
        lastWrite,
        new Promise((resolve) => setTimeout(resolve, SAVE_WAIT_MS)),
      ]).catch((err) => {
        console.error("Points will sync once reconnected:", err);
      }).then(() => {
        bin?.close();
        window.location.href = url;
      });
    }

    function updateFinishLabel(total) {
      if (!finishLabel) return;
      finishLabel.textContent = total >= POINTS.threshold ? "FINISH & CHOOSE REWARD" : "FINISH";
    }

    // ── load initial state ────────────────────────────────────────
    async function init() {
      try {
        applySettingsToPoints(POINTS, await loadKioskSettings());
      } catch (err) {
        console.error("Using default point values:", err);
      }
      try {
        const minCost = await getMinRewardCost();
        if (minCost > 0) POINTS.threshold = Math.min(POINTS.threshold, minCost);
      } catch (err) {
        console.error("Using settings threshold:", err);
      }
      document.getElementById("kioskHint").textContent =
        `Wait until the machine finishes dropping the item. Then you can add another, or tap FINISH (from ${POINTS.threshold} points).`;

      // if returning user scanned a QR, load from Firebase
      const returnID = sessionStorage.getItem("returnVoucherID");
      if (returnID) {
        const result = await scanVoucher(returnID);
        if (result.success) {
          totalPoints = result.total_points;
          voucherID   = returnID;
          sessionStorage.removeItem("returnVoucherID");
          sessionStorage.setItem("voucherID", voucherID);
        }
      } else {
        totalPoints = parseInt(sessionStorage.getItem("totalPoints") || "0");
      }

      render(totalPoints, 0);
      updateFinishLabel(totalPoints);

      // insert.html hands the accepted item over in sessionStorage and sends
      // ?award=1. Drop both first so a page refresh cannot award it twice.
      if (new URLSearchParams(location.search).has("award")) {
        history.replaceState(null, "", location.pathname);
        awardPendingInsert();
      }

      // Only connect once the live point values are in, so an item inserted a
      // second after this screen opens is never paid at the default rate.
      listenToBin();
    }

    function awardPendingInsert() {
      let pending = null;
      try {
        pending = JSON.parse(sessionStorage.getItem("pendingInsert") || "null");
      } catch {
        pending = null;
      }
      sessionStorage.removeItem("pendingInsert");
      if (!pending) return;

      const type = itemTypeByKey(pending.key)
        || itemTypeFor(pending.material, pending.size);
      // Sensors already accepted it. Show Item Accepted, then Processing,
      // until the compressor and servo finish and the bin sends SORTED.
      if (type) handleAddPoints(type, pending.weight, false);
    }

    // Firestore writes run one at a time. Tapping faster than the network
    // used to start several createVoucher calls at once, each minting its
    // own receipt ID and splitting the points across vouchers.
    let writeQueue = Promise.resolve();
    let lastWrite = Promise.resolve();

    function queueWrite(task) {
      lastWrite = writeQueue.then(task);
      writeQueue = lastWrite.catch(err => console.error("Sync failed:", err));
    }

    // ── add points + save to Firebase ────────────────────────────
    function handleAddPoints(type, weight, alreadyDropped) {
      if (redirecting || !type) return;
      const points = Number(POINTS[type.key]) || 0;
      totalPoints += points;

      // what this one insert added, for the Firebase session log
      const inserted = {
        type: type.key,
        label: type.label,
        quantity: 1,
        points,
        grams: Number.isFinite(weight) ? weight : null,
      };

      // running tally for the receipt screen
      const existing = sessionItems.find(i => i.type === type.key);
      if (existing) { existing.quantity++; existing.points += points; }
      else          { sessionItems.push({ ...inserted }); }

      render(totalPoints, points);
      showItem(type, points);
      if (alreadyDropped) {
        announceAccepted();
        showReadyForNext();
      } else {
        showAcceptedThenProcessing();
      }
      updateFinishLabel(totalPoints);
      sessionStorage.setItem("totalPoints", totalPoints);
      // the receipt screen reads this back to list what was inserted
      sessionStorage.setItem("sessionItems", JSON.stringify(sessionItems));

      const runningTotal = totalPoints;

      queueWrite(async () => {
        if (!voucherID) {
          voucherID = await createVoucher([inserted], runningTotal, points);
          sessionStorage.setItem("voucherID", voucherID);
        } else {
          await addPoints(voucherID, [inserted], points);
        }
      });
    }

    // ── the bin keeps the session going ───────────────────────────
    // Shoppers stay on this screen and keep feeding the machine; each accepted
    // item lands here, and a returned one takes them to the rejection screen
    // with their points intact.
    function listenToBin() {
      bin = connectBin({
        onStatus(message) {
          if (redirecting || dropping) return;
          if (!message.bin.connected) {
            setBinStatus("Bin is offline — tap FINISH to keep your points.", true);
            return;
          }
          setBinStatus("You can drop the next bottle, or tap FINISH.");
        },

        onDetect(message) {
          if (redirecting) return;
          const grams = message.weight ? ` (${message.weight} g)` : "";
          setBinStatus(`Checking your item${grams}...`);
        },

        onItem(message) {
          if (redirecting) return;
          const type = itemTypeFor(message.material, message.size);
          if (!type) {
            leaveTo("itemrejected.html?reason=UNKNOWN_ITEM");
            return;
          }
          handleAddPoints(type, message.weight);
        },

        onSorted() {
          if (redirecting || !dropping) return;
          showReadyForNext();
        },

        onReject(message) {
          if (redirecting) return;
          leaveTo(`itemrejected.html?reason=${encodeURIComponent(message.reason || "UNKNOWN_ITEM")}`);
        },

        onOffline() {
          if (redirecting) return;
          setBinStatus("Waiting for the kiosk hardware...", true);
        },
      });
    }

    function leaveTo(url) {
      if (redirecting) return;
      redirecting = true;
      sessionStorage.setItem("totalPoints", totalPoints);
      goAfterWrites(url);
    }

    // ── events ────────────────────────────────────────────────────
    window.addEventListener("pagehide", () => bin?.close());

    finishBtn.addEventListener("click", function (e) {
      e.preventDefault();
      if (redirecting) return;
      finishBtn.disabled = true;
      sessionStorage.setItem("totalPoints", totalPoints);
      redirecting = true;
      const next = totalPoints >= POINTS.threshold ? "redeemready.html" : "notenoughpoints.html";
      goAfterWrites(next);
    });

    init();
  </script>
</body>
</html>
