<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Congratulations - Redeem Reward</title>
  <link rel="stylesheet" href="redeemready.css" />
</head>
<body>
  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>

  <div class="page-container">
    <header class="brand-header">
      <img src="logo.png" class="brand-logo" alt="EcoNova Logo">
    </header>

    <main class="content-area">
      <h1 class="title">CONGRATULATIONS!</h1>

      <div class="message-section">
        <p class="message-text">You have enough points for</p>
        <p class="reward-text">Food Reward!</p>
      </div>

      <div class="points-ring-container">
        <div class="ring-wrapper">
          <div class="dot-ring" aria-label="Points ring display">
            <span class="dot" style="--index: 0;"></span>
            <span class="dot" style="--index: 1;"></span>
            <span class="dot" style="--index: 2;"></span>
            <span class="dot" style="--index: 3;"></span>
            <span class="dot" style="--index: 4;"></span>
            <span class="dot" style="--index: 5;"></span>
            <span class="dot" style="--index: 6;"></span>
            <span class="dot" style="--index: 7;"></span>
            <span class="dot" style="--index: 8;"></span>
            <span class="dot" style="--index: 9;"></span>
            <span class="dot" style="--index: 10;"></span>
            <span class="dot" style="--index: 11;"></span>
          </div>

          <div class="points-center">
            <div class="points-label">Total Points</div>
            <div class="points-value">
              <!-- dynamic — filled by script below -->
              <span id="totalPoints">0</span><span class="star">★</span>
            </div>
          </div>
        </div>
      </div>

      <!-- reward type selector -->
      <div class="reward-choice" style="margin-bottom:12px;">
        <label style="color:#1A2B22;font-weight:600;margin-right:8px;">Choose reward:</label>
        <select id="rewardType" style="padding:6px 12px;border-radius:8px;border:1px solid #14848B;color:#1A2B22;">
          <option value="sardines">🐟 Canned Sardines</option>
          <option value="tuna">🐠 Canned Tuna</option>
        </select>
      </div>

      <button class="btn btn-redeem" id="redeemBtn">
        <span class="btn-icon">🎁</span>
        <span>REDEEM</span>
      </button>

      <p id="redeemMsg" style="color:#E24B4A;font-size:13px;margin-top:8px;display:none;"></p>
    </main>

    <div class="wave-background" aria-hidden="true"></div>
  </div>

  <script type="module">
    import { redeemReward } from './firebase-config.js';

    // show real points
    const total = parseInt(sessionStorage.getItem("totalPoints") || "0", 10);
    document.getElementById("totalPoints").textContent = total;

    document.getElementById("redeemBtn").addEventListener("click", async function () {
      const btn    = this;
      const msg    = document.getElementById("redeemMsg");
      const reward = document.getElementById("rewardType").value;

      // check points first before anything
      if (total < 50) {
        msg.textContent   = "Not enough points. Need at least 50.";
        msg.style.display = "block";
        return;
      }

      btn.disabled      = true;
      btn.textContent   = "Processing...";

      let voucherID = sessionStorage.getItem("voucherID");

      // if no voucherID yet, just go straight to dispensing (demo mode)
      if (!voucherID) {
        sessionStorage.removeItem("totalPoints");
        window.location.href = "dispensingfood.html";
        return;
      }

      // if voucherID exists, try Firebase
      const result = await redeemReward(voucherID, reward);
      if (result.success) {
        sessionStorage.removeItem("voucherID");
        sessionStorage.removeItem("totalPoints");
        window.location.href = "dispensingfood.html";
      } else {
        // Firebase failed but points are enough — go anyway for demo
        sessionStorage.removeItem("totalPoints");
        window.location.href = "dispensingfood.html";
      }
    });
  </script>
</body>
</html>
